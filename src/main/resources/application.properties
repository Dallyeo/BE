spring.profiles.include=secret

spring.application.name=Dallyeo

# Server
server.port=8080

# DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/dallyeo?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
#spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT (U1-b 인증에서 사용; 설정만 선반영)
jwt.secret=${JWT_SECRET}
jwt.access-expiration=3600000
jwt.refresh-expiration=604800000

# ===== TourAPI (외부 연동) — U1-a =====
# serviceKey는 환경변수 주입(코드/VCS 저장 금지). 로컬은 .env(git 제외).
tourapi.base-url=https://apis.data.go.kr/B551011/KorService2
tourapi.service-key=${TOURAPI_SERVICE_KEY}
tourapi.connect-timeout=2s
tourapi.read-timeout=3s
tourapi.cache-ttl=30m

# ===== Resilience4j (D1 어노테이션 / D2 엔드포인트별 인스턴스) =====
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.retry.configs.default.max-attempts=2
resilience4j.retry.configs.default.wait-duration=500ms
resilience4j.retry.configs.default.enable-exponential-backoff=true
resilience4j.retry.configs.default.exponential-backoff-multiplier=2
# 재시도 대상: 5xx / 네트워크·타임아웃 / IO. 4xx(클라이언트 오류)는 재시도 제외.
resilience4j.retry.configs.default.retry-exceptions=org.springframework.web.client.HttpServerErrorException,org.springframework.web.client.ResourceAccessException,java.io.IOException
resilience4j.retry.configs.default.ignore-exceptions=org.springframework.web.client.HttpClientErrorException
# 엔드포인트별 인스턴스(D2) — default 상속.
resilience4j.circuitbreaker.instances.tourApiAreaBased.base-config=default
resilience4j.retry.instances.tourApiAreaBased.base-config=default
# U3 장소 오퍼레이션(엔드포인트별 서킷, N1)
resilience4j.circuitbreaker.instances.tourApiSearchKeyword.base-config=default
resilience4j.retry.instances.tourApiSearchKeyword.base-config=default
resilience4j.circuitbreaker.instances.tourApiLocationBased.base-config=default
resilience4j.retry.instances.tourApiLocationBased.base-config=default
resilience4j.circuitbreaker.instances.tourApiDetailCommon.base-config=default
resilience4j.retry.instances.tourApiDetailCommon.base-config=default
resilience4j.circuitbreaker.instances.tourApiDetailIntro.base-config=default
resilience4j.retry.instances.tourApiDetailIntro.base-config=default

# ===== Logging (US-COMMON-3: 로거 교정) =====
# (교정) com.celdog → com.ppip.dallyeo (오설정 수정)
logging.level.com.ppip.dallyeo=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.transaction=DEBUG
logging.level.org.springframework.orm.jpa=DEBUG
logging.level.org.springframework.web=DEBUG

logging.file.name=./logs/app.log