spring.profiles.include=secret

spring.application.name=Dallyeo

# Server (포트 외부화 — 블루-그린에서 8080/8081 두 인스턴스 실행)
server.port=${SERVER_PORT:8080}
# 그레이스풀 셧다운 — 옛 인스턴스가 진행 중 요청을 마무리하고 종료(무중단)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Actuator — 헬스체크만 노출(민감정보 숨김). 배포 스위치 판단용.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/dallyeo?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
#spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ===== 업로드 이미지 저장 (러닝 기록 이미지) =====
# dir: 로컬 파일시스템 저장 루트. 배포 시 JAR/릴리스 디렉터리 바깥을 가리켜야 재배포에 파일이 유실되지 않는다.
app.storage.dir=${UPLOAD_DIR:./uploads}
# public-path: 저장 파일 공개 서빙 URL prefix. WebConfig 리소스 핸들러 + 응답 imageUrl 생성에 함께 쓰인다.
app.storage.public-path=/uploads

# 응답에 싣는 이미지 URL의 기준 도메인. 코스·업적·러닝 이미지가 전체 URL로 나간다
# (장소 이미지는 TourAPI가 준 전체 URL이라 그대로). 운영은 환경변수로 실제 도메인 주입.
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}
app.storage.max-bytes=10485760
# 서블릿 멀티파트 상한 — app.storage.max-bytes(10MB)와 맞춰 컨테이너 단에서도 과대 요청을 끊는다.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# JWT (U4/U1-b) — HS256 자체 발급/검증. 만료는 ms.
# US-AUTH-2: Access 24h(86400000) / Refresh 7d(604800000). (U1-a 선반영값 1h→24h 교정)
jwt.secret=${JWT_SECRET}
jwt.access-expiration=86400000
jwt.refresh-expiration=604800000

# ===== OAuth 소셜 로그인 (U4) =====
oauth.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
oauth.apple.jwks-uri=https://appleid.apple.com/auth/keys
oauth.apple.issuer=https://appleid.apple.com
oauth.apple.audience=${APPLE_CLIENT_ID:}

# ===== TourAPI (외부 연동) — U1-a =====
# serviceKey는 환경변수 주입(코드/VCS 저장 금지). 로컬은 .env(git 제외).
tourapi.base-url=https://apis.data.go.kr/B551011/KorService2
tourapi.service-key=${TOURAPI_SERVICE_KEY}
tourapi.connect-timeout=2s
tourapi.read-timeout=3s
tourapi.cache-ttl=30m
# 영업시간(detailIntro2) 전용 TTL. 목록 채우기는 항목당 1회 호출이라 개발계정 일일 한도(약 1,000회)가
# 실질 제약이다. 영업시간은 하루 단위로 안 바뀌므로 길게 잡아 호출량을 줄인다.
tourapi.intro-cache-ttl=24h
# 보관 중인 영업시간을 다시 받아올 주기(place_business_hours). 영업시간은 몇 달에 한 번 바뀔까 말까 한
# 값이라 길게 잡는다 — 짧게 잡을수록 일일 호출 한도를 그만큼 더 쓴다.
tourapi.hours-refresh-after=30d
# 목록(검색/지역/반경) 응답에 영업시간을 실으려면 항목마다 detailIntro2를 호출해야 한다.
# 동시 호출 수와 총 소요 예산으로 상한을 둔다(예산 초과분은 businessHours=null, 캐시 적재 후엔 사실상 즉시).
tourapi.intro-concurrency=8
tourapi.intro-budget=4s

# ===== Resilience4j (D1 어노테이션 / D2 엔드포인트별 인스턴스) =====
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.retry.configs.default.max-attempts=2
resilience4j.retry.configs.default.wait-duration=500ms
resilience4j.retry.configs.default.enable-exponential-backoff=true
resilience4j.retry.configs.default.exponential-backoff-multiplier=2
# 재시도 대상: 5xx / 네트워크·타임아웃 / IO. 4xx(클라이언트 오류)는 재시도 제외.
resilience4j.retry.configs.default.retry-exceptions=org.springframework.web.client.HttpServerErrorException,org.springframework.web.client.ResourceAccessException,java.io.IOException
resilience4j.retry.configs.default.ignore-exceptions=org.springframework.web.client.HttpClientErrorException
# 엔드포인트별 인스턴스(D2) — default 상속.
resilience4j.circuitbreaker.instances.tourApiAreaBased.base-config=default
resilience4j.retry.instances.tourApiAreaBased.base-config=default
# U3 장소 오퍼레이션(엔드포인트별 서킷, N1)
resilience4j.circuitbreaker.instances.tourApiSearchKeyword.base-config=default
resilience4j.retry.instances.tourApiSearchKeyword.base-config=default
resilience4j.circuitbreaker.instances.tourApiLocationBased.base-config=default
resilience4j.retry.instances.tourApiLocationBased.base-config=default
resilience4j.circuitbreaker.instances.tourApiDetailCommon.base-config=default
resilience4j.retry.instances.tourApiDetailCommon.base-config=default
resilience4j.circuitbreaker.instances.tourApiDetailIntro.base-config=default
resilience4j.retry.instances.tourApiDetailIntro.base-config=default
# 목록 영업시간 채우기 전용(detailIntroBulk) — 상세 화면(/places/{id})의 서킷과 반드시 분리한다.
# 목록 한 건이 수십~수백 호출을 몰아 부르므로, 공유하면 목록 실패가 상세 조회까지 막는다.
resilience4j.circuitbreaker.instances.tourApiDetailIntroBulk.base-config=default
resilience4j.circuitbreaker.instances.tourApiDetailIntroBulk.sliding-window-size=50
resilience4j.circuitbreaker.instances.tourApiDetailIntroBulk.minimum-number-of-calls=30
resilience4j.circuitbreaker.instances.tourApiDetailIntroBulk.wait-duration-in-open-state=30s
# 공공데이터포털 초당 요청 제한(429) 회피.
# ⚠️ 2026-09-09 실측: 25 req/s를 "지속"하면 초당한도 초과(reasonCode 23)가 발생했다.
#    짧은 버스트(40건/0.5초)는 78 req/s도 통과하므로, 문제는 순간 속도가 아니라 지속 속도다.
#    운영 키의 실제 한도를 재측정하기 전까지 보수적으로 10으로 둔다.
resilience4j.ratelimiter.instances.tourApiDetailIntroBulk.limit-for-period=10
resilience4j.ratelimiter.instances.tourApiDetailIntroBulk.limit-refresh-period=1s
resilience4j.ratelimiter.instances.tourApiDetailIntroBulk.timeout-duration=3s
# U4 소셜 외부호출(엔드포인트별 서킷/재시도)
resilience4j.circuitbreaker.instances.oauthKakaoUserInfo.base-config=default
resilience4j.retry.instances.oauthKakaoUserInfo.base-config=default
resilience4j.circuitbreaker.instances.oauthAppleJwks.base-config=default
resilience4j.retry.instances.oauthAppleJwks.base-config=default

# ===== Logging (US-COMMON-3: 로거 교정) =====
# (교정) com.celdog → com.ppip.dallyeo (오설정 수정)
logging.level.com.ppip.dallyeo=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.transaction=DEBUG
logging.level.org.springframework.orm.jpa=DEBUG
logging.level.org.springframework.web=DEBUG

logging.file.name=./logs/app.log