name: CI/CD (main → EC2 blue-green)

# main 에 push 되면: 빌드+전체테스트 → EC2 로 blue-green 무중단 배포
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}   # 수동 실행도 허용

# 배포 중복 방지(같은 브랜치는 순차 실행)
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-pw
          MYSQL_DATABASE: dallyeo
        ports: [ "3306:3306" ]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -p$MYSQL_ROOT_PASSWORD"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7
        ports: [ "6379:6379" ]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      # application.properties 의 ${...} 플레이스홀더 해소용(테스트 전용 더미).
      # 실제 시크릿 아님 — 진짜 값은 서버 /etc/dallyeo/dallyeo.env 에만 존재.
      DB_USERNAME: root
      DB_PASSWORD: ci-root-pw
      JWT_SECRET: ci-dummy-jwt-secret-value-min-32-characters
      TOURAPI_SERVICE_KEY: ci-dummy-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build & test (MySQL/Redis 서비스 컨테이너 사용)
        run: ./gradlew --no-daemon clean build
      - name: Collect boot JAR
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-plain' | head -1)
          echo "boot jar: $JAR"
          cp "$JAR" app.jar
      - uses: actions/upload-artifact@v4
        with:
          name: dallyeo-jar
          path: app.jar
          retention-days: 5

  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dallyeo-jar
      - name: Upload JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          source: app.jar
          target: /tmp/dallyeo-deploy
      - name: Blue-green switch on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            set -e
            REL="/opt/dallyeo/releases/app-${{ github.sha }}.jar"
            sudo install -D -m 644 /tmp/dallyeo-deploy/app.jar "$REL"
            sudo /opt/dallyeo/deploy.sh "$REL"
            rm -f /tmp/dallyeo-deploy/app.jar
