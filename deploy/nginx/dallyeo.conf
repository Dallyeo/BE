# Dallyeo Nginx 서버 블록.
# 설치 위치: /etc/nginx/conf.d/dallyeo.conf  (upstream 은 dallyeo-upstream.conf 에서 include)
#
# 주의: 아래 443 블록의 ssl_certificate 경로는 `certbot --nginx` 실행 시 자동으로 채워집니다.
#       처음에는 80 블록만 두고 certbot 을 돌린 뒤, certbot 이 443 리다이렉트/인증서를 추가합니다.
#       (수동 인증서면 443 블록의 주석을 풀고 경로를 직접 지정)

server {
    listen 80;
    server_name dallyeo.cloud;   # ← 실제 도메인으로 교체

    # Let's Encrypt 갱신용 (certbot webroot). certbot --nginx 사용 시 자동 처리됨.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    # (certbot 실행 후) HTTP → HTTPS 리다이렉트로 교체됨
    location / {
        proxy_pass http://dallyeo_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout    30s;
    }
}

