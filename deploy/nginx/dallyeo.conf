# Dallyeo Nginx 서버 블록.
# 설치 위치: /etc/nginx/conf.d/dallyeo.conf  (upstream 은 dallyeo-upstream.conf 에서 include)
#
# ⚠️ 이 파일은 **certbot 실행 전(신규 서버 세팅용)** 형상입니다.
#    `certbot --nginx` 를 돌리면 certbot 이 이 파일을 직접 고쳐서
#    ① 아래 server 블록을 443(SSL)으로 개조하고
#    ② HTTP→HTTPS 리다이렉트 전용 80 블록을 새로 추가합니다.
#    실행 후 형상은 파일 맨 아래 "certbot 실행 후 참고" 섹션 참조.

server {
    listen 80;
    server_name dallyeo.cloud;   # ← 실제 도메인으로 교체

    # 러닝 기록 이미지 업로드(앱 상한 10MB)보다 커야 413이 안 난다. nginx 기본값은 1MB.
    # ⚠️ certbot 이 이 블록을 443 으로 개조할 때 이 줄도 함께 따라간다.
    #    다만 certbot 을 **처음부터 다시** 돌려 블록이 재생성되면 유실될 수 있으니,
    #    업로드가 갑자기 413 이 나면 제일 먼저 여기를 확인할 것.
    client_max_body_size 12m;

    # Let's Encrypt 갱신용 (certbot webroot). certbot --nginx 사용 시 자동 처리됨.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        proxy_pass http://dallyeo_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout    30s;
    }
}

