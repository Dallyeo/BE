plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ppip'
version = '0.0.1-SNAPSHOT'
description = 'Dallyeo'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    //web
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    //JPA + MySQL
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'

    //Security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    //Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    //Actuator (헬스체크 — 블루-그린 무중단 배포 스위치 판단용)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    //Resilience4j (외부 TourAPI 회복성: 재시도/서킷브레이커) — U1-a
    // NOTE(호환성): Spring Boot 4.0.x 기준 resilience4j 호환 버전은 Build & Test에서 확인·고정.
    // resilience4j-spring-boot3 가 spring-boot-starter-aop(aspectjweaver)를 전이 의존으로 포함.
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'

    //JWT (U1-b/U4) — jjwt HS256 자체 발급/검증.
    // NOTE(호환성): Spring Boot 4.0.x는 Jackson 3(tools.jackson) 사용. jjwt-jackson은 Jackson 2(com.fasterxml)
    // databind를 전이 의존으로 가져와 공존한다. 버전 호환은 Build & Test에서 확인·고정.
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    //Apple identity token(RS256) JWKS 검증 — U4
    implementation 'com.nimbusds:nimbus-jose-jwt:9.48'

    //Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    //Test
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-jdbc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // 외부 TourAPI 목킹(단위/통합 테스트)
    testImplementation 'org.wiremock:wiremock-standalone:3.9.1'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}
